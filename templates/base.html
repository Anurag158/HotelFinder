<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HotelFinder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"><span class="brand-mark">H</span> HotelFinder</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavigation">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('search') }}">Find Hotels</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('recommend') }}">Recommendations</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
      </ul>
      <a class="btn btn-nav ms-lg-3" href="{{ url_for('search') }}">Search now</a>
    </div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer class="footer mt-5">
  <div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2">
    <div><strong>HotelFinder</strong><div class="small text-white-50">Explore hotel information from the HotelFinder.</div></div>
    <div class="small text-white-50 align-self-md-end">Booking rates are historical observations, not live booking prices.</div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
